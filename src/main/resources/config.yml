# ==========================================================
#                  ChurchSMP Configuration
# ==========================================================

settings:
  # Action bar format when holding a legendary weapon or using gem abilities.
  # Available placeholders:
  # %skill1_name%, %skill1_status% (Ready! / Active (Xs) / Cooldown (Xs))
  # %skill2_name%, %skill2_status% (Ready! / Active (Xs) / Cooldown (Xs))
  action_bar_format: "<gray>[<gold>%skill1_name%: %skill1_status%<gray>] <dark_gray>| <gray>[<gold>%skill2_name%: %skill2_status%<gray>]"

  # Status format strings
  status_ready: "<green><bold>Ready!</bold></green>"
  status_active: "<aqua><bold>Active (%time%s)</bold></aqua>"
  status_cooldown: "<red><bold>%time%s</bold></red>"

  # Sound effects
  ability_ready_sound: true
  bossbar_enabled: true

# Alignment options (GOOD, EVIL, NULLIFIED)
alignments:
  default: "NULLIFIED"

# Relic Gems Cooldowns & Values (in seconds)
gems:
  wrath:
    cooldown: 40
    duration: 8
    damage_multiplier: 1.35
  greed:
    cooldown: 45
    duration: 10
    bonus_drop_multiplier: 2.0
  gluttony:
    cooldown: 35
    duration: 6
    devour_heal_amount: 4.0
  lust:
    cooldown: 30
    duration: 5
    pull_radius: 8.0
  envy:
    cooldown: 40
    duration: 10
    steal_percentage: 0.20
  pride:
    cooldown: 50
    duration: 12
    max_stacks: 5
  sloth:
    cooldown: 35
    duration: 8
    slow_radius: 6.0
    slow_amplifier: 2

# Legendary Weapons Settings
weapons:
  excalibur:
    primary_cooldown: 45
    secondary_cooldown: 80
  luminescence_spear:
    primary_cooldown: 12
    secondary_cooldown: 130
  mayim:
    primary_cooldown: 30
    secondary_cooldown: 45
  judas:
    primary_cooldown: 16
    secondary_cooldown: 40
  sorrowess:
    primary_cooldown: 30
    secondary_cooldown: 100
  voidbreaker:
    primary_cooldown: 75
    secondary_cooldown: 10
  grim:
    primary_cooldown: 60
    secondary_cooldown: 80
